<!-- AI生成 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>S16 全球总决赛 · 策略对决</title>
  <meta name="description" content="S16 全球总决赛网页策略小游戏：真实名单雷达 + 程序推演 + 团战观战" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
<p data-aigc-mark="1" style="margin:0 0 8px;font-size:10px;line-height:1.3;color:#6b6560;font-weight:400;">AI生成</p>

  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark"></div>
        <div>
          <div class="brand-title">S16 · 策略对决</div>
          <div class="brand-sub">Worlds Strategy Clash</div>
        </div>
      </div>
    </header>

    <!-- ============ pick ============ -->
    <section data-screen="pick" class="screen active">
      <div class="section-title">
        <h2>选择主队</h2>
        <p class="muted">真实 S16 名单 · 点击查看雷达与五路</p>
      </div>
      <div class="pick-layout">
        <div class="panel">
          <div id="teamGrid" class="team-grid"></div>
          <div class="hub-actions">
            <button class="btn btn-primary" id="btnConfirmPick">确认开赛</button>
          </div>
        </div>
        <div class="panel">
          <div id="pickDetail">
            <p class="muted">选择一支战队，查看真实赛段雷达与五路名单。</p>
          </div>
          <div class="radar-split">
            <canvas id="pickRadar" width="280" height="280"></canvas>
          </div>
        </div>
      </div>
    </section>

    <!-- ============ hub ============ -->
    <section data-screen="hub" class="screen">
      <div class="section-title">
        <h2>赛场总览 <span class="tag" id="hubStage">积分赛</span></h2>
        <p class="muted">对阵 · 积分 · 下一步</p>
      </div>
      <div class="hub-layout">
        <div class="panel">
          <div id="bracket" class="match-grid"></div>
          <div id="hubActions" class="hub-actions"></div>
        </div>
        <div class="panel">
          <h3>积分榜</h3>
          <div id="standingsList"></div>
        </div>
      </div>
    </section>

    <!-- ============ prep ============ -->
    <section data-screen="prep" class="screen">
      <div class="section-title">
        <h2>战前决策</h2>
        <p class="muted">阵容体系 + 团战风格（你的唯一决策层）</p>
      </div>
      <div id="vsPanel" class="vs-panel"></div>
      <div class="panel" style="margin-top:14px">
        <h3>阵容体系</h3>
        <div id="lineupGrid" class="choice-grid"></div>
        <h3 style="margin-top:16px">团战风格</h3>
        <div id="styleGrid" class="choice-grid"></div>
        <div class="hub-actions">
          <button class="btn btn-primary" id="btnToStrategy">开始推演观战</button>
        </div>
      </div>
    </section>

    <!-- ============ battle ============ -->
    <section data-screen="battle" class="screen">
      <div class="section-title">
        <h2>对局推演</h2>
        <p class="muted">预测面板 + 战报 + 团战动画</p>
      </div>
      <div id="bo1ScoreBanner" class="bo1-score-banner" hidden></div>
      <div class="battle-wrap">
        <div>
          <div id="predPanel" class="pred-panel"></div>
          <div id="phaseNow" class="panel" style="margin-top:12px"></div>
          <canvas id="battleCanvas" width="640" height="360" style="margin-top:12px"></canvas>
        </div>
        <div>
          <div id="battleLog" class="battle-log"></div>
          <div id="commentaryBox" class="commentary-box" aria-label="解说"></div>
          <div class="hub-actions" id="battleActions">
            <button class="btn btn-primary" id="btnBattleNext" disabled>查看 BO5 结果</button>
            <button class="btn" id="btnNextGame" hidden>直接开始下一局</button>
            <button class="btn" id="btnAdjustTactics" hidden>调整战术</button>
          </div>
        </div>
      </div>
    </section>

    <!-- ============ result ============ -->
    <section data-screen="result" class="screen">
      <div id="resultBanner" class="result-banner"></div>
      <div class="panel">
        <h3>赛果数据</h3>
        <div id="resultStats"></div>
      </div>
      <div class="panel" style="margin-top:12px">
        <h3>复盘</h3>
        <div id="roundRecap"></div>
        <div class="hub-actions">
          <button class="btn btn-primary" id="btnResultNext">返回赛场总览</button>
        </div>
      </div>
    </section>

    <!-- ============ champion ============ -->
    <section data-screen="champion" class="screen">
      <div id="championBox"></div>
    </section>
  </div>

  <script src="js/roster.js"></script>
  <script src="js/data.js"></script>
  <script src="js/radar.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/anim.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
